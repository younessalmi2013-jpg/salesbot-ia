[phases.setup]
nixPkgs = ["nodejs_20", "chromium", "nss", "nspr", "atk", "cups", "dbus", "expat", "libdrm", "libxkbcommon", "mesa", "libgbm", "alsa-lib", "pango"]

[phases.install]
cmds = ["npm ci --only=production"]

[phases.build]
cmds = []

[start]
cmd = "export PUPPETEER_EXECUTABLE_PATH=$(which chromium 2>/dev/null || find /nix/store -maxdepth 6 -name chromium -type f 2>/dev/null | grep bin/chromium | head -1) && echo [nixpacks] CHROMIUM=$PUPPETEER_EXECUTABLE_PATH && node src/server.js"
