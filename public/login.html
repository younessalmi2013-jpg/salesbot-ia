<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SalesBot IA — Connexion</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0f;--card:#12121a;--border:#1e1e2e;--primary:#6c5ce7;--primary-hover:#7c6ef7;--text:#e2e2e8;--muted:#6b6b80;--red:#ef4444;--green:#10b981}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem}
.login-wrapper{width:100%;max-width:400px}
.login-logo{text-align:center;margin-bottom:2rem}
.login-logo h1{font-size:1.6rem;font-weight:700;letter-spacing:-.02em}
.login-logo h1 span{color:var(--primary)}
.login-logo p{color:var(--muted);font-size:.82rem;margin-top:.4rem}
.login-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:2rem}
.login-card h2{font-size:1.1rem;font-weight:600;margin-bottom:1.5rem;text-align:center}
.form-group{margin-bottom:1.2rem}
.form-group label{display:block;font-size:.78rem;color:var(--muted);margin-bottom:.4rem;font-weight:500}
.form-group input{width:100%;padding:.7rem .9rem;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.88rem;transition:border .2s}
.form-group input:focus{outline:none;border-color:var(--primary)}
.btn-login{width:100%;padding:.75rem;background:var(--primary);color:#fff;border:none;border-radius:8px;font-size:.9rem;font-weight:600;cursor:pointer;transition:background .2s;margin-top:.5rem}
.btn-login:hover{background:var(--primary-hover)}
.btn-login:disabled{opacity:.5;cursor:not-allowed}
.error-msg{display:none;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:8px;padding:.6rem .9rem;color:var(--red);font-size:.82rem;margin-bottom:1rem;text-align:center}
.error-msg.show{display:block}
.version{text-align:center;margin-top:1.5rem;color:var(--muted);font-size:.72rem}
</style>
</head>
<body>
<div class="login-wrapper">
  <div class="login-logo">
    <h1>&#129302; Sales<span>Bot IA</span></h1>
    <p>Plateforme de vente automatisee</p>
  </div>
  <div class="login-card">
    <h2>Connexion</h2>
    <div class="error-msg" id="errorMsg"></div>
    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>Nom d'utilisateur</label>
        <input type="text" id="username" placeholder="admin" required autofocus />
      </div>
      <div class="form-group">
        <label>Mot de passe</label>
        <input type="password" id="password" placeholder="Mot de passe" required />
      </div>
      <button type="submit" class="btn-login" id="btnLogin">Se connecter</button>
    </form>
  </div>
  <div class="version">SalesBot IA v3.0 &mdash; Multi-tenant SaaS</div>
</div>
<script>
async function handleLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('btnLogin');
  const errEl = document.getElementById('errorMsg');
  errEl.classList.remove('show');
  btn.disabled = true;
  btn.textContent = 'Connexion en cours...';
  try {
    const res = await fetch('/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value.trim(),
        password: document.getElementById('password').value
      })
    });
    const data = await res.json();
    if (res.ok) {
      window.location.href = '/dashboard';
    } else {
      errEl.textContent = data.error || 'Identifiants invalides';
      errEl.classList.add('show');
    }
  } catch (err) {
    errEl.textContent = 'Erreur reseau — verifiez votre connexion';
    errEl.classList.add('show');
  }
  btn.disabled = false;
  btn.textContent = 'Se connecter';
}
// If already logged in, redirect
fetch('/auth/me').then(r => { if (r.ok) window.location.href = '/dashboard'; }).catch(() => {});
</script>
</body>
</html>
